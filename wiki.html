<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Doorverwijzing — Open Vertaling</title>
    <meta name="robots" content="noindex">
    <!-- De wiki staat sinds de splitsing (2026-10-08) op Open Gods Woord.
         Dit is alleen een doorverwijzing voor oude links: documentatie van de
         vertaling blijft op deze site, al het andere gaat naar de wiki daar. -->
    <script src="/js/sites.js"></script>
    <script>
    (function () {
        var hash = location.hash.replace('#', '');
        var lokaal = ['uitgangspunten', 'principes', 'statistieken', 'changelog', 'grondteksten',
                      'strongs-en-grondtekst', 'bronnen', 'citaatvragen', 'downloads'];
        if (!hash) location.replace('over-ov.html#documentatie');
        else if (lokaal.indexOf(hash) !== -1) location.replace(hash + '.html');
        else location.replace(KASites.url('ogw', 'wiki.html#' + hash));
    })();
    </script>
</head>
<body>
    <p><a href="over-ov.html#documentatie">Documentatie</a> · <a href="https://opengodswoord.nl/wiki.html">Wiki op Open Gods Woord</a></p>
</body>
</html>
