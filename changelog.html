    <link rel="stylesheet" href="css/style.css">

    <style>
        body { display: block; background: #f8f6f2; }
        .page { max-width: 900px; padding: 30px 24px 80px; font-family: var(--font-body); }
        .page h1 { font-family: var(--font-cursive); font-size: 36px; color: var(--navy); font-weight: 400; margin-bottom: 4px; }
        .page .subtitle { color: var(--teal); font-size: 14px; margin-bottom: 30px; }
        .version-block { margin-bottom: 32px; }
        .version-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; border-bottom: 2px solid var(--gold); padding-bottom: 8px; }
        .version-badge { background: var(--navy); color: var(--gold); font-size: 16px; font-weight: 700; padding: 4px 12px; border-radius: 4px; }
        .version-date { color: var(--teal); font-size: 14px; }
        .change-list { padding-left: 0; list-style: none; }
        .change-list li { padding: 6px 0; border-bottom: 1px solid #f0ede8; font-size: 14px; line-height: 1.6; }
        .change-type { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 3px; margin-right: 6px; text-transform: uppercase; }
        .type-principe { background: #ede9fe; color: #5b21b6; }
        .type-feature { background: #dcfce7; color: #166534; }
        .type-fix { background: #fef3c7; color: #92400e; }
        .type-systeem { background: #dbeafe; color: #1e40af; }
        .type-bulk { background: #d1fae5; color: #065f46; }
        .type-uitzondering { background: #fce7f3; color: #9d174d; }
    </style>
    <style>
        @media all {
            body.in-iframe #topnav { display: none !important; }
            body.in-iframe { min-height: auto; }
        }
    </style>
</head>
<body>
<script src="js/iframe-navigation.js"></script>
    <nav id="topnav"></nav>
    <script src="js/topnav.js"></script>

        <main class="page">
            <h1>Changelog</h1>
            <p class="subtitle">Alle wijzigingen per versie</p>

            <div class="review-tempo" style="border:1px solid #e5e1d8;border-left:4px solid #cba449;border-radius:0 8px 8px 0;background:#faf8f4;padding:16px 20px;margin:0 0 24px;font-size:14px;line-height:1.7;">
                <div style="font-weight:700;color:#142e42;font-size:15px;margin-bottom:6px;">Nakijktempo <span style="font-weight:400;color:#666;">— eerste vers-voor-vers ronde</span></div>
                <div>Voortgang: <strong><span data-stat="verses_verified">29.744</span></strong> / <span data-stat="verses_total">31.175</span> verzen handmatig nagekeken (<strong><span data-stat="verses_verified_pct" data-stat-suffix="%">95,4%</span></strong>)</div>
                <div>Tempo: ± <strong><span data-stat="review_verses_per_week">1.390</span></strong> verzen per week <span style="color:#666;">(sinds <span data-stat="review_since">7 juni 2026</span>)</span></div>
                <div>Nog te gaan: <span data-stat="review_remaining_verses">1.431</span> verzen</div>
                <div style="margin-top:6px;">Verwachte afronding bij dit tempo: <strong style="color:#142e42;"><span data-stat="review_eta">26 september 2026</span></strong></div>
                <div id="review-chart" style="margin-top:14px;"></div>
            </div>

            <div id="changelog-container">Laden...</div>
        </main>

    <script>
    async function loadChangelog() {
        const resp = await fetch('data/changelog.json');
        const data = await resp.json();
        const container = document.getElementById('changelog-container');

        const typeLabels = {
            'principe': 'Principe', 'fix': 'Fix', 'systeem': 'Systeem',
            'bulk': 'Bulk', 'uitzondering': 'Uitzondering', 'feature': 'Nieuw'
        };
        const typeClass = {
            'principe': 'type-principe', 'fix': 'type-fix', 'systeem': 'type-systeem',
            'bulk': 'type-bulk', 'uitzondering': 'type-uitzondering', 'feature': 'type-feature'
        };

        // Groepeer per versie (data/changelog.json heeft nieuwste bovenaan)
        const versies = {};
        for (const dag of data.wijzigingen) {
            const v = dag.versie || 'onbekend';
            if (!versies[v]) versies[v] = [];
            versies[v].push(dag);
        }

        let html = '';
        for (const [versie, dagen] of Object.entries(versies)) {
            const alleItems = dagen.flatMap(d => d.items.map(i => ({...i, datum: d.datum})));
            html += `<div class="version-block" id="${versie}">
                <div class="version-header">
                    <span class="version-badge">${versie || 'dev'}</span>
                    <span class="version-date">${dagen.map(d => d.datum).join(', ')}</span>
                    <span style="color:#999;font-size:13px;">${alleItems.length} wijzigingen</span>
                </div>
                <ul class="change-list">
                    ${alleItems.map(item => {
                        const t = item.type || 'fix';
                        return `<li>
                            <span class="change-type ${typeClass[t] || 'type-fix'}">${typeLabels[t] || t}</span>
                            ${item.id ? `<strong>${item.id}</strong> ` : ''}
                            ${item.beschrijving || ''}
                            ${item.aantal ? ` (${item.aantal}x)` : ''}
                        </li>`;
                    }).join('')}
                </ul>
            </div>`;
        }

        container.innerHTML = html;

        // Scroll naar hash
        if (location.hash) {
            const el = document.getElementById(location.hash.slice(1));
            if (el) el.scrollIntoView({behavior: 'smooth'});
        }
    }

    loadChangelog();
    </script>
<script src="js/stats-inject.js"></script>
<script src="js/review-chart.js"></script>
</body>
</html>
