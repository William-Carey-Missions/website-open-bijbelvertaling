name: Publish finished audio
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Public audio release tag (empty performs connection check)
        required: false
        type: string
      deploy_reader:
        description: Publish the tested audio reader and browser cache fix
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-finished-audio
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust existing deployment host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Check audio destination
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'set -e; test -d /var/www/openvertaling.nl/site; if ! command -v ffmpeg >/dev/null; then apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg; fi; df -h /var/www/openvertaling.nl/site'
      - name: Deploy tested audio reader
        if: inputs.deploy_reader || inputs.release_tag != ''
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: rsync -rtR --chmod=F644,D755 -e "ssh -p $DEPLOY_PORT" js/audio-available.js js/app.js sw.js "$DEPLOY_USER@$DEPLOY_HOST:/var/www/openvertaling.nl/site/"
      - name: Prepare selected release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"higgs-audio-[0-9-]+",os.environ["RELEASE_TAG"])'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets' > /tmp/audio-release.json
      - name: Publish verified verses and chapters
        if: inputs.release_tag != ''
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          stage="/tmp/openvertaling-audio-${GITHUB_RUN_ID}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 0700 '$stage'"
          scp -P "$DEPLOY_PORT" scripts/audio/install_release.py /tmp/audio-release.json "$DEPLOY_USER@$DEPLOY_HOST:$stage/"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "python3 '$stage/install_release.py' --assets-json '$stage/audio-release.json' --root /srv/openvertaling/audio/higgs-20261109"
      - name: Link persistent audio into website
        if: inputs.release_tag != ''
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'test -f /srv/openvertaling/audio/higgs-20261109/catalogus.json && install -d -m 0755 /var/www/openvertaling.nl/site/audio && ln -sfnT /srv/openvertaling/audio/higgs-20261109 /var/www/openvertaling.nl/site/audio/higgs-20261109'
