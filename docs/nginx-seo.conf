# Twee correcties voor /etc/nginx/sites-available/openvertaling.nl, naar het
# voorbeeld van de Open Parafrase Weergave (deploy/nginx.conf in die repo).
#
# Nu geeft elke onbestaande URL de homepage terug met status 200, en
# www.openvertaling.nl toont dezelfde site met status 200. Zoekmachines zien
# daardoor kopieën van de homepage en elke pagina twee keer.
#
# 1. In het HTTPS-blok van openvertaling.nl: vervang de bestaande `location /`
#    (die terugvalt op /index.html) door onderstaande. De leesweergave
#    gebruikt hash-adressen (index.html#boek/hoofdstuk) en zoekvragen
#    (index.html?q=), die hebben de terugval niet nodig. Laat de bestaande
#    include van openvertaling-collaboration.conf staan.
location / {
    try_files $uri $uri/ =404;
}

# 2. Haal www.openvertaling.nl uit de server_name van dat blok en voeg dit
#    blok toe (certificaatpaden zoals in het hoofdblok):
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.openvertaling.nl;

    ssl_certificate /etc/letsencrypt/live/openvertaling.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvertaling.nl/privkey.pem;

    return 301 https://openvertaling.nl$request_uri;
}

# Daarna: sudo nginx -t && sudo systemctl reload nginx
