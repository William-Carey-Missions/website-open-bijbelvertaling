name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    uses: OpenAEC-Foundation/github/.github/workflows/deploy-site.yml@main
    with:
      deploy_host: ${{ vars.DEPLOY_HOST }}
      deploy_port: ${{ vars.DEPLOY_PORT }}
      deploy_user: ${{ vars.DEPLOY_USER }}
      deploy_path: /var/www/openvertaling.nl/site
      deploy_source: .
      # De API synchroniseert hierna de catalogus; pas daarna worden status en
      # downloads op de server uit de actuele, accountgebonden beslissingen gebouwd.
      # build_leespaginas.py schrijft de Bijbeltekst als gewone HTML (bijbel/) en
      # als platte tekst (llms-full.txt), zodat zoekmachines en AI-crawlers hem vinden.
      # build_search_index.py houdt de zoekfunctie van de site gelijk met de tekst;
      # met de hand bijgewerkt liep die index twee maanden achter.
      build_command: python scripts/build_illustraties.py && python scripts/build_review_catalog.py && python scripts/build_leespaginas.py && python scripts/build_search_index.py && python scripts/build_sitemap.py
      rsync_excludes: |
        .git/
        .github/
        .claude/
        docs/
        tests/
        bronbestanden/
        reviews/
        .superpowers/
        .mobile-shots/
        audio/
        server/
        migrations/
        data/verified-chapters.json
        downloads/*.zip
        downloads/*.epub
        downloads/index.json
    secrets:
      deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}

  deploy-collaboration-api:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust deploy host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload collaboration API
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          stage="/tmp/openvertaling-collaboration-${GITHUB_SHA}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 0700 '$stage'"
          scp -P "$DEPLOY_PORT" server/* "$DEPLOY_USER@$DEPLOY_HOST:$stage/"
      - name: Install collaboration API
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          stage="/tmp/openvertaling-collaboration-${GITHUB_SHA}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash '$stage/install_collaboration_api.sh' '$stage'"
      - name: Build verified release snapshot and downloads
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'cd /var/www/openvertaling.nl/site && python3 scripts/export_review_status.py && python3 scripts/build_stats.py && python3 scripts/build_downloads.py'
      - name: Remove uploaded installation files
        if: always()
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          stage="/tmp/openvertaling-collaboration-${GITHUB_SHA}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "find '$stage' -type f -delete && rmdir '$stage'"
