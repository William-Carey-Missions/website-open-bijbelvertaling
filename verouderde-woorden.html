    <style>
        body { display: block; background: #f8f6f2; }
        .page { max-width: 1200px; padding: 30px 24px 80px; font-family: var(--font-body); }
        .page h1 { font-family: var(--font-cursive); font-size: 36px; color: var(--navy); font-weight: 400; margin-bottom: 4px; }
        .page .subtitle { color: var(--teal); font-size: 14px; margin-bottom: 16px; }

        .summary-bar {
            display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
            background: #fff; border: 1px solid var(--border); border-radius: 8px;
            padding: 12px 18px; margin-bottom: 16px; font-size: 13px;
        }
        .stat { display: flex; align-items: center; gap: 6px; }
        .stat .num { font-weight: 600; color: var(--navy); font-size: 16px; }
        .stat.ja .num { color: #15803d; }
        .stat.nee .num { color: #b91c1c; }
        .stat.nb .num { color: #999; }
        .summary-bar .right { margin-left: auto; display: flex; gap: 8px; }
        .btn {
            background: var(--navy); color: #fff; border: none; padding: 7px 14px;
            border-radius: 5px; font-size: 13px; cursor: pointer; font-family: var(--font-body);
        }
        .btn:hover { background: #1f3f5a; }
        .btn.secondary { background: #fff; color: var(--navy); border: 1px solid var(--border); }
        .btn.secondary:hover { background: rgba(203,164,73,0.08); }
        .btn.danger { background: #b91c1c; }

        .toolbar {
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
            margin-bottom: 16px;
        }
        .zoek-input {
            flex: 1; min-width: 220px; padding: 9px 14px; border: 1px solid #ddd;
            border-radius: 6px; font-size: 14px; font-family: var(--font-body); outline: none;
        }
        .zoek-input:focus { border-color: var(--gold); }
        .filter-btn {
            padding: 6px 12px; border: 1px solid #ddd; border-radius: 16px;
            font-size: 12px; cursor: pointer; background: #fff; font-family: var(--font-body);
            transition: all 0.15s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--navy); color: #fff; border-color: var(--navy);
        }
        .filter-btn.ja.active { background: #15803d; border-color: #15803d; }
        .filter-btn.nee.active { background: #b91c1c; border-color: #b91c1c; }
        .filter-btn.nb.active { background: #999; border-color: #999; }

        .sectie {
            background: #fff; border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 18px; overflow: hidden;
        }
        .sectie h2 {
            margin: 0; padding: 12px 18px; background: var(--navy); color: #fff;
            font-size: 15px; font-family: var(--font-body); font-weight: 600;
            display: flex; align-items: center; gap: 12px;
        }
        .sectie h2 .count {
            background: rgba(255,255,255,0.18); padding: 2px 8px; border-radius: 10px;
            font-size: 11px; font-weight: 500;
        }
        .sectie-bulk {
            margin-left: auto; display: flex; gap: 4px;
        }
        .sectie-bulk button {
            background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25);
            padding: 3px 9px; border-radius: 4px; font-size: 11px; cursor: pointer;
            font-family: var(--font-body);
        }
        .sectie-bulk button:hover { background: rgba(255,255,255,0.22); }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f5f2ed; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 600; color: var(--navy); }
        td { padding: 8px 10px; border-bottom: 1px solid #f0ede8; vertical-align: top; }
        tr:hover { background: rgba(203,164,73,0.04); }
        tr.ja { background: rgba(21,128,61,0.06); }
        tr.nee { background: rgba(185,28,28,0.06); }

        .col-keuze { width: 130px; }
        .col-woord { width: 150px; }
        .col-num { width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
        .col-voorgesteld { width: 140px; }
        .col-argument { width: 220px; }

        .woord-cell { font-weight: 600; color: var(--navy); font-family: 'Fira Mono', monospace; }
        .voorbeeld {
            font-size: 12px; color: #555; line-height: 1.5; max-height: 4em; overflow: hidden;
            position: relative;
        }
        .voorbeeld em { color: var(--navy); font-style: italic; font-weight: 500; }
        .voorgesteld { color: #15803d; font-weight: 500; font-family: 'Fira Mono', monospace; font-size: 12px; }
        .argument { color: #6b7280; font-size: 12px; }

        .keuze-group { display: inline-flex; gap: 0; border-radius: 5px; overflow: hidden; border: 1px solid #ddd; }
        .keuze-group label {
            padding: 4px 8px; cursor: pointer; font-size: 11px; font-weight: 600;
            background: #fff; color: #999; border-right: 1px solid #ddd;
            display: flex; align-items: center; gap: 3px;
        }
        .keuze-group label:last-child { border-right: none; }
        .keuze-group input { display: none; }
        .keuze-group label:hover { background: #f5f2ed; }
        .keuze-group input[value="ja"]:checked + .lbl { background: #15803d; color: #fff; }
        .keuze-group input[value="nee"]:checked + .lbl { background: #b91c1c; color: #fff; }
        .keuze-group input[value="nb"]:checked + .lbl { background: #ddd; color: #333; }
        .lbl {
            padding: 4px 8px; cursor: pointer; font-size: 11px; font-weight: 600;
            background: #fff; color: #999;
        }

        @media all {
            body.in-iframe #topnav { display: none !important; }
            body.in-iframe div[style*="display:flex;min-height"] { display: block !important; }
            body.in-iframe { min-height: auto; }
        }

<body>
<script>if (window.self !== window.top) document.body.classList.add('in-iframe');</script>
<nav id="topnav"></nav>
    <script src="js/topnav.js"></script>
<div class="doc-shell" style="display:flex;min-height:calc(100vh - 52px);">
    <nav class="doc-sidebar" data-doc-menu="lexicon"></nav>
    <script src="js/doc-sidebar.js"></script>

    <div class="page" style="flex:1;">
        <h1>Verouderde woorden — beslissen</h1>
        <p class="subtitle">Vink per woord aan: <strong style="color:#15803d;">Ja</strong> (vervangen), <strong style="color:#b91c1c;">Nee</strong> (behouden), of laat staan op <em>nog niet beslist</em>. Beslissingen worden lokaal opgeslagen en kunnen worden geëxporteerd als JSON of als wijzigingsprincipes-fragment.</p>

        <div class="summary-bar">
            <div class="stat"><span class="num" id="cnt-totaal">0</span> totaal</div>
            <div class="stat ja"><span class="num" id="cnt-ja">0</span> vervangen</div>
            <div class="stat nee"><span class="num" id="cnt-nee">0</span> behouden</div>
            <div class="stat nb"><span class="num" id="cnt-nb">0</span> nog te beslissen</div>
            <div class="right">
                <button class="btn secondary" onclick="exportJSON()">📥 Export JSON</button>
                <button class="btn secondary" onclick="exportPrincipes()">📥 Export als principes</button>
                <button class="btn danger" onclick="resetAll()">↺ Reset</button>
            </div>
        </div>

        <div class="toolbar">
            <input type="text" class="zoek-input" id="zoek" placeholder="Zoek woord, voorbeeld of argument…" oninput="render()">
            <button class="filter-btn active" data-filter="alle" onclick="setFilter(this, 'alle')">Alle</button>
            <button class="filter-btn nb" data-filter="nb" onclick="setFilter(this, 'nb')">Nog te beslissen</button>
            <button class="filter-btn ja" data-filter="ja" onclick="setFilter(this, 'ja')">Vervangen</button>
            <button class="filter-btn nee" data-filter="nee" onclick="setFilter(this, 'nee')">Behouden</button>
        </div>

        <div id="container">Laden…</div>
    </div>
</div>

<script>
const STORAGE_KEY = 'verouderde-woorden-keuzes-v1';
let data = null;
let keuzes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let huidigFilter = 'alle';

async function init() {
    try {
        const r = await fetch('data/verouderde-woorden.json');
        data = await r.json();
        render();
    } catch (e) {
        document.getElementById('container').innerHTML = '<p style="color:#b91c1c;">Fout bij laden van data/verouderde-woorden.json</p>';
    }
}

function setKeuze(woord, val) {
    if (val === 'nb') delete keuzes[woord];
    else keuzes[woord] = val;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(keuzes));
    updateStats();
    // visueel: rij-class
    const tr = document.querySelector(`tr[data-woord="${CSS.escape(woord)}"]`);
    if (tr) {
        tr.classList.remove('ja', 'nee');
        if (val === 'ja') tr.classList.add('ja');
        else if (val === 'nee') tr.classList.add('nee');
    }
    if (huidigFilter !== 'alle') render();
}

function setFilter(btn, val) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    huidigFilter = val;
    render();
}

function bulkSectie(sectieIdx, val) {
    if (!confirm(`Alle nog niet besliste woorden in deze sectie markeren als "${val === 'ja' ? 'vervangen' : 'behouden'}"?`)) return;
    data.secties[sectieIdx].items.forEach(it => {
        if (!keuzes[it.woord]) {
            if (val === 'nb') return;
            keuzes[it.woord] = val;
        }
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(keuzes));
    render();
}

function escapeHTML(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
    if (!data) return;
    const zoek = (document.getElementById('zoek').value || '').toLowerCase().trim();
    const container = document.getElementById('container');
    let html = '';

    data.secties.forEach((sectie, sIdx) => {
        const filtered = sectie.items.filter(it => {
            const k = keuzes[it.woord] || 'nb';
            if (huidigFilter !== 'alle' && huidigFilter !== k) return false;
            if (zoek) {
                const blob = (it.woord + ' ' + (it.voorbeeld || '') + ' ' + (it.voorgesteld || '') + ' ' + (it.argument || '')).toLowerCase();
                if (!blob.includes(zoek)) return false;
            }
            return true;
        });
        if (filtered.length === 0) return;

        html += `<div class="sectie">
            <h2>
                ${escapeHTML(sectie.titel)}
                <span class="count">${filtered.length}${filtered.length !== sectie.items.length ? ' / ' + sectie.items.length : ''}</span>
                <span class="sectie-bulk">
                    <button onclick="bulkSectie(${sIdx}, 'ja')">Alle → vervangen</button>
                    <button onclick="bulkSectie(${sIdx}, 'nee')">Alle → behouden</button>
                </span>
            </h2>
            <table>
                <thead><tr>
                    <th class="col-keuze">Beslissing</th>
                    <th class="col-woord">Woord</th>
                    <th class="col-num">×</th>
                    <th class="col-num">#bk</th>
                    <th>Voorbeeld</th>
                    <th class="col-voorgesteld">Voorstel</th>
                    <th class="col-argument">Argument</th>
                </tr></thead>
                <tbody>
                    ${filtered.map(it => {
                        const k = keuzes[it.woord] || 'nb';
                        const id = 'k_' + it.woord.replace(/[^a-z0-9]/gi, '_');
                        return `<tr data-woord="${escapeHTML(it.woord)}" class="${k === 'ja' ? 'ja' : (k === 'nee' ? 'nee' : '')}">
                            <td class="col-keuze">
                                <span class="keuze-group">
                                    <input type="radio" name="${id}" value="ja" id="${id}_ja" ${k==='ja'?'checked':''} onchange="setKeuze('${escapeHTML(it.woord)}','ja')"><label class="lbl" for="${id}_ja" style="${k==='ja'?'background:#15803d;color:#fff;':''}">Ja</label>
                                    <input type="radio" name="${id}" value="nee" id="${id}_nee" ${k==='nee'?'checked':''} onchange="setKeuze('${escapeHTML(it.woord)}','nee')"><label class="lbl" for="${id}_nee" style="${k==='nee'?'background:#b91c1c;color:#fff;':''}">Nee</label>
                                    <input type="radio" name="${id}" value="nb" id="${id}_nb" ${k==='nb'?'checked':''} onchange="setKeuze('${escapeHTML(it.woord)}','nb')"><label class="lbl" for="${id}_nb" style="${k==='nb'?'background:#ddd;color:#333;':''}">?</label>
                                </span>
                            </td>
                            <td class="col-woord woord-cell">${escapeHTML(it.woord)}</td>
                            <td class="col-num">${it.voorkomens || ''}</td>
                            <td class="col-num">${it.boeken || ''}</td>
                            <td class="voorbeeld">${escapeHTML(it.voorbeeld || '').replace(new RegExp('\\\\b' + it.woord.replace(/[.*+?^${}()|[\]\\]/g,'\\\\$&') + '\\\\b','gi'), m => '<em>'+m+'</em>')}</td>
                            <td class="col-voorgesteld voorgesteld">${escapeHTML(it.voorgesteld || '')}</td>
                            <td class="col-argument argument">${escapeHTML(it.argument || '')}</td>
                        </tr>`;
                    }).join('')}
                </tbody>
            </table>
        </div>`;
    });

    container.innerHTML = html || '<p style="color:#999;text-align:center;padding:30px;">Geen resultaten in dit filter.</p>';
    updateStats();
}

function updateStats() {
    if (!data) return;
    const totaal = data.secties.reduce((n, s) => n + s.items.length, 0);
    let ja = 0, nee = 0;
    data.secties.forEach(s => s.items.forEach(it => {
        const k = keuzes[it.woord];
        if (k === 'ja') ja++;
        else if (k === 'nee') nee++;
    }));
    document.getElementById('cnt-totaal').textContent = totaal;
    document.getElementById('cnt-ja').textContent = ja;
    document.getElementById('cnt-nee').textContent = nee;
    document.getElementById('cnt-nb').textContent = totaal - ja - nee;
}

function exportJSON() {
    const out = {
        gegenereerd: new Date().toISOString(),
        keuzes: keuzes,
    };
    download('verouderde-woorden-keuzes.json', JSON.stringify(out, null, 2), 'application/json');
}

function exportPrincipes() {
    // Build wijzigingsprincipes-style entries for ja-keuzes
    const entries = [];
    data.secties.forEach(s => s.items.forEach(it => {
        if (keuzes[it.woord] === 'ja') {
            entries.push({
                oud: it.woord,
                nieuw: (it.voorgesteld || '').split('/')[0].trim(),
                categorie: 'Verouderde woorden',
                voorgesteld_alternatieven: it.voorgesteld,
                argument: it.argument,
                voorkomens: it.voorkomens,
            });
        }
    }));
    const out = {
        gegenereerd: new Date().toISOString(),
        aantal: entries.length,
        principes_voorstel: entries,
    };
    download('verouderde-woorden-principes.json', JSON.stringify(out, null, 2), 'application/json');
}

function download(name, content, mime) {
    const blob = new Blob([content], {type: mime});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
}

function resetAll() {
    if (!confirm('Alle beslissingen wissen?')) return;
    keuzes = {};
    localStorage.removeItem(STORAGE_KEY);
    render();
}

init();
</script>
<script src="js/stats-inject.js"></script>
</body>
</html>
