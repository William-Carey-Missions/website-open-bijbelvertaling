name: Publish finished audio
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Public audio release tag (empty performs connection check)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: publish-finished-audio
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust existing deployment host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Check audio destination
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'test -d /var/www/openvertaling.nl/site && command -v ffmpeg && df -h /var/www/openvertaling.nl/site'
      - name: Prepare selected release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"higgs-audio-[0-9-]+",os.environ["RELEASE_TAG"])'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets' > /tmp/audio-release.json
      - name: Publish verified verses and chapters
        if: inputs.release_tag != ''
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          stage="/tmp/openvertaling-audio-${GITHUB_RUN_ID}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 0700 '$stage'"
          scp -P "$DEPLOY_PORT" scripts/audio/install_release.py /tmp/audio-release.json "$DEPLOY_USER@$DEPLOY_HOST:$stage/"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "python3 '$stage/install_release.py' --assets-json '$stage/audio-release.json' --root /var/www/openvertaling.nl/site/audio/higgs-20261109"
