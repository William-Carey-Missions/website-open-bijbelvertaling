<!doctype html>
<html lang="nl">
<head>
    <script type="module" src="/js/auth-bootstrap.js"></script>
    <meta charset="utf-8">
    <script src="/js/theme.js"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Beoordelingen — Open Vertaling</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/collaboration.css">
    <link rel="stylesheet" href="css/ontwerp.css?v=1">
</head>
<body>
    <nav id="topnav"></nav>
    <script src="js/topnav.js"></script>
    <main class="collaboration-main" hidden>
        <div class="collaboration-heading">
            <h1>Beoordelingen</h1>
            <a class="secondary-button" href="correcties.html">Correctietaken</a>
            <a class="secondary-button" href="herverificatie.html">Hoofdstukken afvinken</a>
            <a id="review-history-link" class="secondary-button" href="beoordelingsgeschiedenis.html" hidden>Beoordelingsgeschiedenis</a>
        </div>
        <p class="collaboration-intro">Goedkeuringen zijn aan de exacte gegevensversie gekoppeld. Verandert de tekst of locatie, dan moet die nieuwe versie opnieuw worden beoordeeld.</p>
        <div class="collaboration-toolbar">
            <label>Zoeken
                <input id="reviews-search" type="search" autocomplete="off" placeholder="Naam of gegevens-id">
            </label>
            <label>Soort
                <select id="reviews-type">
                    <option value="">Alle gegevens</option>
                </select>
            </label>
            <label>Status
                <select id="reviews-state">
                    <option value="">Alle statussen</option>
                    <option value="pending">Te beoordelen</option>
                    <option value="correction-needed">Aanpassing nodig</option>
                    <option value="approved">Goedgekeurd</option>
                </select>
            </label>
        </div>
        <p id="reviews-status" class="collaboration-status" role="status"></p>
        <div class="table-shell">
            <table id="reviews-table" class="collaboration-table">
                <thead><tr><th>Gegevens</th><th>Soort</th><th>Status</th><th>Verifiëren</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="collaboration-pagination">
            <button id="reviews-prev" class="secondary-button" type="button">Vorige</button>
            <span id="reviews-page"></span>
            <button id="reviews-next" class="secondary-button" type="button">Volgende</button>
        </div>
    </main>
    <script src="js/review-components.js"></script>
    <script src="js/beoordelingen.js"></script>
</body>
</html>
